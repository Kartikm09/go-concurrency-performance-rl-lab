name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.5", cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: golangci/golangci-lint-action@v8
        with: { version: "v2.12.2" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: PYTHONPATH=evaluator/src python -m unittest discover -s evaluator/tests -v
      - run: python scripts/verify_evaluations.py
      - run: python scripts/validate_repository.py
